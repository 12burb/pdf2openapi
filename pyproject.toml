[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2openapi"
version = "0.1.0"
description = "Turn vendor PDF API docs into OpenAPI specs, and get alerted when the PDF changes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "12burb" }]
keywords = ["openapi", "pdf", "swagger", "api", "mcp", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "pymupdf>=1.24",
  "pyyaml>=6",
  "httpx>=0.27",
  "openapi-spec-validator>=0.7",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pdf2openapi = "pdf2openapi.cli:main"

[project.urls]
Homepage = "https://github.com/12burb/pdf2openapi"
Changelog = "https://github.com/12burb/pdf2openapi/blob/main/CHANGELOG.md"
Issues = "https://github.com/12burb/pdf2openapi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2openapi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
